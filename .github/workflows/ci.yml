name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download deps
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  # Integration tests require live Dataceen credentials. They run only when
  # the secret DATACEEN_CLIENT_SECRET is configured on the repo.
  integration:
    name: Live integration
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: test
    env:
      RUN_INTEGRATION: '1'
      DATACEEN_TENANT_ID: ${{ secrets.DATACEEN_TENANT_ID }}
      DATACEEN_CLIENT_ID: ${{ secrets.DATACEEN_CLIENT_ID }}
      DATACEEN_CLIENT_SECRET: ${{ secrets.DATACEEN_CLIENT_SECRET }}
      DATACEEN_DOMAIN: ${{ secrets.DATACEEN_DOMAIN }}
      DATACEEN_MODEL: ${{ secrets.DATACEEN_MODEL }}
      DATACEEN_SCOPE: ${{ secrets.DATACEEN_SCOPE }}
      DATACEEN_API_URL: ${{ secrets.DATACEEN_API_URL }}
      DATACEEN_API_PATH: ${{ secrets.DATACEEN_API_PATH }}
      DATACEEN_API_SCOPE: ${{ secrets.DATACEEN_API_SCOPE }}
      DATACEEN_SUBSCRIPTION_URL: ${{ secrets.DATACEEN_SUBSCRIPTION_URL }}
      DATACEEN_SUBSCRIPTION_SCOPE: ${{ secrets.DATACEEN_SUBSCRIPTION_SCOPE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Skip if no secret
        if: ${{ env.DATACEEN_CLIENT_SECRET == '' }}
        run: |
          echo "DATACEEN_CLIENT_SECRET not configured — skipping live tests"
          exit 0

      - name: Live integration tests
        if: ${{ env.DATACEEN_CLIENT_SECRET != '' }}
        run: |
          go test -v -run Integration ./pkg/dataceen ./pkg/generated ./pkg/dataceen/subscriptions

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
